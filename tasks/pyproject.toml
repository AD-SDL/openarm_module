[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpl-openarm-centrifuge"
version = "0.1.0"
description = "Isaac Lab bimanual OpenArm centrifuge pick-and-place task (tube into bucket)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "RPL" }]
keywords = ["isaaclab", "openarm", "manipulation", "bimanual", "centrifuge", "imitation-learning"]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

# Runtime deps. ``isaaclab`` brings ``isaaclab_assets`` (which provides
# OPENARM_BI_HIGH_PD_CFG) with it, so we don't list it separately.
dependencies = [
  "gymnasium",
  "torch",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
# One-shot helper: run once after ``pip install`` to drop an auto-import .pth
# file into site-packages so the gym IDs register without any script edits.
rpl-openarm-centrifuge-install-autoreg = "rpl_openarm_centrifuge._install_autoreg:main"

[project.urls]
Homepage = "https://github.com/AD-SDL/openarm_module"

##
## setuptools configuration
##

[tool.setuptools]
include-package-data = true
# Note: the auto-import .pth file (src/rpl_openarm_centrifuge_autoregister.pth) is
# installed into site-packages by ``setup.py`` rather than configured here —
# pyproject's ``data-files`` form can't reliably target the purelib path across
# Python versions, so we use a small setuptools install hook.

[tool.setuptools.packages.find]
where = ["src"]
include = ["rpl_openarm_centrifuge*"]

[tool.setuptools.package-data]
# Bundle USDs and the auto-register .pth shim alongside the Python modules.
"rpl_openarm_centrifuge" = ["assets/*.usd", "assets/*.usdc", "assets/*.usda", "*.pth"]
